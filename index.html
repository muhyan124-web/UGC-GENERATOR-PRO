<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGC Generator Pro - AI SaaS Marketing Content</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 glass border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
          <i data-lucide="sparkles" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
          UGC Generator <span class="text-xs px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">PRO</span>
        </span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openTab('history')" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
          <i data-lucide="history" class="w-5 h-5"></i>
        </button>
        <button onclick="openTab('settings')" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    
    <!-- Tab: Generator -->
    <div id="tab-generator" class="space-y-8">
      
      <!-- Input Form -->
      <section class="glass p-6 sm:p-8 rounded-2xl shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-60 h-60 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 text-white">Generate UGC Content</h1>
        <p class="text-slate-400 mb-6 text-sm sm:text-base">Masukkan URL produk atau detail produk untuk menghasilkan copy iklan viral instant.</p>

        <form id="generator-form" onsubmit="handleGenerate(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Product URL / Marketplace Link</label>
